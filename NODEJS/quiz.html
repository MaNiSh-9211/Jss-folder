<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #quiz-container {
      max-width: 600px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #43cea2, #185a9d);
      text-align: center;
    }

    button {
      background-color: #6a3093;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3b5998;
    }

    button:focus {
      outline: none;
    }

    button.selected {
      background-color: #2e8b57;
    }
  </style>
</head>
<body>

<div id="quiz-container">
  <h1>Quiz App</h1>
  <div id="question-container"></div>
  <div id="options-container"></div>
  <button id="submit-btn" onclick="submitAnswer()">Submit</button>
  <button id="next-btn" onclick="nextQuestion()" style="display:none;">Next</button>
  <button id="restart-btn" onclick="restartQuiz()" style="display:none;">Restart Quiz</button>
</div>

<script>
  const questions = [
    {
      question: "What is the name of your favourite cartoon character?",
      options: ["choota bheem", "sharko", "oggy", "Doremon"],
      correctAnswer: "Doremon",
      score: 10
    },
    {
      question: "Who is your favourite female influnser?",
      options: ["rakhi savant", "mia ji", "sunny leony", "urfi javed"],
      correctAnswer: "mia ji",
      score: 10
    },
    {
      question: "Guess the nickname of manjul?",
      options: ["Moma jan", "Manjulika", "Moma", "Chota moma"],
      correctAnswer: "Moma",
      score: 10
    },
    // Add more questions...
  ];

  let currentQuestionIndex = 0;
  let score = 0;
  let selectedButton = null;

  function displayQuestion() {
    const questionContainer = document.getElementById("question-container");
    const optionsContainer = document.getElementById("options-container");

    questionContainer.textContent = questions[currentQuestionIndex].question;

    optionsContainer.innerHTML = "";
    questions[currentQuestionIndex].options.forEach((option, index) => {
      const optionBtn = document.createElement("button");
      optionBtn.textContent = option;
      optionBtn.onclick = () => selectOption(optionBtn, index);
      optionsContainer.appendChild(optionBtn);
    });
  }

  function selectOption(button, selectedIndex) {
    const selectedOption = questions[currentQuestionIndex].options[selectedIndex];
    const correctAnswer = questions[currentQuestionIndex].correctAnswer;

    if (selectedButton) {
      selectedButton.classList.remove('selected');
    }
    
    button.classList.add('selected');
    selectedButton = button;

    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("next-btn").style.display = "inline";
  }

  function submitAnswer() {
    const selectedOption = document.querySelector("button:focus");
    if (!selectedOption) {
      // alert("Please select an option.");
    }
  }

  function nextQuestion() {
    currentQuestionIndex++;

    if (currentQuestionIndex < questions.length) {
      displayQuestion();
      document.getElementById("submit-btn").style.display = "inline";
      document.getElementById("next-btn").style.display = "none";
      selectedButton = null; // Reset the selectedButton for the next question
    } else {
      showResult();
    }
  }

  function showResult() {
    alert(`Quiz completed!\nYour score: ${score}`);
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("restart-btn").style.display = "inline";
  }

  function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    selectedButton = null;
    displayQuestion();
    document.getElementById("submit-btn").style.display = "inline";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("restart-btn").style.display = "none";
  }

  // Initial display
  displayQuestion();
</script>

</body>
</html>
